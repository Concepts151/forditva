name: forditva
description: "A new Flutter project."
publish_to: "none"

version: 1.0.1+74

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  drift: ^2.14.0
  image_picker: ^0.8.7+3
  file_picker: ^8.1.7
  mime: ^1.0.0
  audio_waveforms: ^1.0.5
  just_audio: ^0.10.3
  record: ^5.0.0 # For audio recording
  flutter_tts: ^4.2.2
  permission_handler: ^12.0.0
  flutter_svg: ^2.0.7
  flutter_sound: ^9.2.13 # or latest version
  flutter_slidable: ^4.0.0
  http: ^1.4.0
  flutter_html: ^3.0.0 # Or the latest version
  audioplayers: ^5.2.1
  path_provider: ^2.1.1
  provider: ^6.1.0
  path: ^1.9.0
  sqlite3_flutter_libs: ^0.5.18
  flutter_dotenv: ^5.1.0
  flutter_keyboard_visibility: ^6.0.0
  share_plus: ^10.0.1
  flutter_localizations:
    sdk: flutter
  url_launcher: ^6.1.7
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.0
  auto_size_text: ^3.0.0
  intl: ^0.20.0
  image: ^4.5.4
  flutter_secure_storage: ^9.2.2
  android_id: ^0.4.0
  pdfx: ^2.9.2
  firebase_core: ^4.14.0
  firebase_app_check: ^0.4.7
  # Gemini through Firebase AI Logic (App Check), so no Gemini key ships
  # in the app. 4.x: 5.0.0 was only a day old on 2026-10-16.
  firebase_ai: ^4.0.0
  cloud_functions: ^6.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.14.0
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  win32: ^5.5.3

flutter_icons:
  android: true
  ios: true
  image_path: "assets/favicon.png" # ←
flutter:
  generate: true
  uses-material-design: true

  assets:
    - .env
    - assets/flags/
    - assets/images/
    - assets/images/logo.png
    - assets/png24/black/
    - assets/png24/white/
    - assets/splash/
